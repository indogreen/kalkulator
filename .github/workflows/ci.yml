name: CI Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation-check:
    name: Documentation & Foundation Verification
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Core Documents
        run: |
          echo "Verifying core foundation documents..."
          test -f README.md || (echo "Missing README.md" && exit 1)
          test -f docs/IMPLEMENTATION_PLAN.md || (echo "Missing docs/IMPLEMENTATION_PLAN.md" && exit 1)
          test -f DESIGN.md || (echo "Missing DESIGN.md" && exit 1)
          test -f AGENTS.md || (echo "Missing AGENTS.md" && exit 1)
          test -f CLAUDE.md || (echo "Missing CLAUDE.md" && exit 1)
          test -f .gitignore || (echo "Missing .gitignore" && exit 1)
          echo "All core foundation documents verified."

  build-and-test:
    name: Build & Test Suite
    needs: foundation-check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies & Build Production Assets
        run: |
          echo "Installing dependencies..."
          npm ci || npm install
          echo "Building Tailwind CSS & standalone JS bundle..."
          npm run build

      - name: Run Full Test Suite
        run: |
          echo "Running automated test suite..."
          npm test
